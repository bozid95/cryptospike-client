services:
  client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cryptospike-client
    restart: always
    ports:
      - "${PORT:-3080}:80"
    environment:
      - PORT=3030
      - SERVER_URL=${SERVER_URL:-https://signal.forlearning.my.id}
      - CLIENT_TOKEN=${CLIENT_TOKEN:-}
    volumes:
      - client_data:/app/server/data

volumes:
  client_data:
    name: cryptospike_client_data
